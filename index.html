<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Englisch lernen</title>

  <style>
    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      box-sizing: border-box;
      font-family: Verdana, sans-serif;

      background: linear-gradient(
        to bottom right,
        #c7e4e4,
        #66a5c1
      );

      background-attachment: fixed;
      text-align: center;
      padding: 2em;
      color: #333;
    }

    h1 {
      font-size: 2em;
      color: #2a7de1;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: transparent;
      padding: 2em;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    .song-text {
      font-size: 1.4em;
      margin: 1em 0 0.5em;
      background: #e0f7fa;
      padding: 1em;
      border-radius: 10px;
    }

    .feedback {
      font-size: 1.2em;
      margin-top: 1em;
      background: #e0f7fa;
      padding: 1em;
      border-radius: 10px;
      height: 27px;
      overflow: hidden;
    }

    button {
      padding: 0.7em 1.2em;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 0.5em;
    }

    .check-btn {
      background-color: #4caf50;
      color: white;
    }

    .next-btn {
      background-color: #2196f3;
      color: white;
    }

    .back-btn {
      background-color: #ff9800;
      color: white;
    }

    .radio-group {
      margin-bottom: 1em;
      font-size: 1.1em;
    }

    .mode-group {
      margin-bottom: 1em;
      font-size: 1.1em;
    }

    .mode-group label {
      margin: 0 1em;
    }

    .all-options {
      display: none;
      margin-top: 1em;
      font-size: 1.1em;
    }

    .all-options label {
      margin: 0 1em;
    }

    .topic-select {
      min-width: 230px;
      padding: 0.7em 1.2em;
      font-family: Verdana, sans-serif;
      font-size: 1em;
      color: #222;
      background-color: #ffd54f;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .table-view {
      display: none;
      max-width: 1100px;
      margin: auto;
      padding: 0;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      text-align: left;
      overflow-x: auto;
    }

    .overview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1em;
    }

    .overview-table th,
    .overview-table td {
      padding: 0.65em 0.8em;
      border-bottom: 1px solid #ddd;
      vertical-align: top;
    }

    .overview-table .topic-row th {
      background-color: #ffd54f;
      color: #222;
      font-size: 1.1em;
      border-top: none;
    }

    .overview-table .topic-row:first-child th {
      border-top: none;
    }

    .overview-table .topic-name {
      width: 24%;
      text-align: left;
    }

    .overview-table .language-head {
      width: 38%;
      text-align: left;
    }

    .overview-table .empty-topic-cell {
      width: 24%;
    }

    .view-toggle-wrap {
      text-align: center;
      margin: 2em auto 0;
    }

    .view-toggle-btn {
      background-color: #607d8b;
      color: white;
      min-width: 190px;
    }

    .speak-hint {
      margin: 1.2em 0 0;
      font-size: 0.9em;
      color: #555;
    }

    .top-toggle {
      margin: 0 auto 2em;
      text-align: center;
    }

    @media (max-width: 700px) {
      body {
        padding: 1em;
      }

      .table-view {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      .overview-table {
        width: 100%;
        table-layout: fixed;
      }

      .overview-table .topic-name {
        width: 28%;
      }

      .overview-table .language-head {
        width: 36%;
      }

      .overview-table .empty-topic-cell {
        width: 28%;
      }

      .overview-table th,
      .overview-table td {
        padding: 0.55em 0.4em;
        overflow-wrap: anywhere;
      }
    }

    .bottom-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5em;
      margin: 2em auto 0;
    }

    .bottom-actions .view-toggle-wrap {
      margin: 0;
    }

    .share-btn {
      width: 46px;
      height: 46px;
      min-width: 46px;
      padding: 0;
      margin: 0.5em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #607d8b;
      color: white;
    }

    .share-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .qr-view {
      display: none;
      max-width: 600px;
      margin: auto;
      text-align: center;
      flex-direction: column;
      align-items: center;
    }

    .qr-form-button {
      order: 1;
    }

    #qrCode {
      order: 2;
    }

    .qr-url {
      order: 3;
    }

    @media (min-width: 701px) {
      #qrCode {
        order: 1;
      }

      .qr-form-button {
        order: 2;
        margin-top: 1.5em;
      }

      .qr-url {
        order: 3;
      }
    }

    #qrCode {
      display: inline-block;
      padding: 16px;
      background: white;
      border-radius: 10px;
    }

    #qrCode canvas,
    #qrCode img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .qr-url {
      margin-top: 1em;
      overflow-wrap: anywhere;
      font-size: 0.9em;
    }

    .settings-btn {
      width: 46px;
      height: 46px;
      min-width: 46px;
      padding: 0;
      margin: 0.5em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #607d8b;
      color: white;
    }

    .settings-btn svg {
      width: 25px;
      height: 25px;
      fill: currentColor;
    }

    .settings-view {
      display: none;
      max-width: 600px;
      margin: auto;
      text-align: center;
    }

    .settings-card {
      background: transparent;
      padding: 2em;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    .settings-section {
      margin: 1.5em 0;
      padding: 1.2em;
      background: #e0f7fa;
      border-radius: 10px;
      text-align: left;
    }

    .settings-section h2 {
      margin: 0 0 1em;
      font-size: 1.2em;
    }

    .theme-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1em;
    }

    .theme-switch {
      position: relative;
      display: inline-block;
      width: 58px;
      height: 32px;
      flex: 0 0 auto;
    }

    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .theme-slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: #bbb;
      border-radius: 32px;
      transition: 0.2s;
    }

    .theme-slider:before {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    .theme-switch input:checked + .theme-slider {
      background: #607d8b;
    }

    .theme-switch input:checked + .theme-slider:before {
      transform: translateX(26px);
    }

    body.dark-mode {
      background: #0b3039;
      color: #e8e8e8;
    }

    body.dark-mode .container,
    body.dark-mode .settings-card {
      background: #17191a;
      color: #e8e8e8;
    }

    body.dark-mode .song-text,
    body.dark-mode .feedback,
    body.dark-mode .settings-section {
      background: #0d4b55;
      color: #e8e8e8;
    }

    body.dark-mode .speak-hint,
    body.dark-mode .qr-url {
      color: #d0d0d0;
    }

    body.dark-mode .table-view {
      color: #e8e8e8;
    }

    body.dark-mode .overview-table th,
    body.dark-mode .overview-table td {
      border-bottom-color: #444;
    }

    body.dark-mode .overview-table .topic-row th {
      border-top-color: #17191a;
    }

    /* Einheitliche Navigation in Tabelle, Einstellungen und QR-Ansicht */

    .top-toggle,
    .settings-nav,
    .qr-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5em;
    }

    .top-toggle {
      margin: 0 auto 2em;
    }

    .settings-nav {
      margin: 0 auto 1.5em;
    }

    .qr-nav {
      margin: 1.5em auto 0;
    }

    .top-toggle .view-toggle-btn,
    .settings-nav .view-toggle-btn,
    .qr-nav .view-toggle-btn {
      min-width: 190px;
    }

    @media (max-width: 700px) {
      .top-toggle,
      .settings-nav,
      .qr-nav {
        gap: 0.25em;
      }

      .top-toggle .view-toggle-btn,
      .settings-nav .view-toggle-btn,
      .qr-nav .view-toggle-btn {
        min-width: 0;
        flex: 1 1 auto;
      }
    }
  </style>
</head>

<body>

  <div class="container" id="formView">

    <h1>Englisch lernen</h1>

    <!-- Wörter / Sätze -->

    <div class="mode-group" id="modeGroup">

      <label>
        <input
          type="radio"
          name="mode"
          value="words"
          checked
          onchange="changeMode()"
        >
        Wörter
      </label>

      <label>
        <input
          type="radio"
          name="mode"
          value="sentences"
          onchange="changeMode()"
        >
        Sätze
      </label>

    </div>

    <!-- Themenauswahl -->

    <div class="radio-group">

      <select
        id="topicSelect"
        class="topic-select"
        onchange="changeTopic()"
      >
        <option value="all">Alles</option>
        <option value="adjektive">Adjektive</option>
        <option value="allgemein">Allgemein</option>
        <option value="alter">Alter</option>
        <option value="begruessung">Begrüßung</option>
        <option value="bewegung">Bewegung</option>
        <option value="farben">Farben</option>
        <option value="gegenstaende">Gegenstände</option>
        <option value="jahreszeiten">Jahreszeiten</option>
        <option value="koerper">Körper</option>
        <option value="monate">Monate</option>
        <option value="nahrung">Nahrung</option>
        <option value="natur">Natur</option>
        <option value="praepositionen">Präpositionen</option>
        <option value="schule">Schule</option>
        <option value="stadt">Stadt</option>
        <option value="tiere">Tiere</option>
        <option value="wetter">Wetter</option>
        <option value="wochentage">Wochentage</option>
        <option value="zahlen">Zahlen</option>
      </select>

      <!-- Alles: Sprache zufällig wählen -->

      <div id="allOptions" class="all-options">

        <label>
          <input
            type="checkbox"
            id="randomEnglish"
            checked
            onchange="resetAllRandom()"
          >
          🇬🇧 Englisch
        </label>

        <label>
          <input
            type="checkbox"
            id="randomGerman"
            checked
            onchange="resetAllRandom()"
          >
          🇩🇪 Deutsch
        </label>

      </div>

    </div>

    <!-- Nicht Alles: Übersetzungsrichtung -->

    <div class="radio-group" id="directionGroup">

      <label>
        <input
          type="radio"
          name="direction"
          value="en-de"
          checked
          onchange="resetUI()"
        >
        🇬🇧 Englisch → Deutsch
      </label>

      <label>
        <input
          type="radio"
          name="direction"
          value="de-en"
          onchange="resetUI()"
        >
        🇩🇪 Deutsch → Englisch
      </label>

    </div>

    <div class="song-text" id="songText">
      Lade Inhalt...
    </div>

    <div class="feedback" id="feedbackArea"></div>

    <div>
      <button
        class="back-btn"
        onclick="prevWord()"
      >
        ⬅️ Zurück
      </button>

      <button
        class="check-btn"
        onclick="checkTranslation()"
      >
        Übersetzung anzeigen
      </button>

      <button
        class="next-btn"
        onclick="nextWord()"
      >
        Nächster ➡️
      </button>
    </div>

    <p class="speak-hint">
      Lies die Wörter vor und sprich die Übersetzung laut aus.
    </p>

  </div>


  <!-- Gesamttabelle -->

  <div class="table-view" id="tableView">

    <div class="bottom-actions top-toggle">

      <button
        class="settings-btn"
        onclick="showSettings()"
        aria-label="Einstellungen"
        title="Einstellungen"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94L14.38 2.8a.49.49 0 0 0-.49-.4h-3.84a.49.49 0 0 0-.49.4l-.36 2.52c-.58.24-1.12.56-1.62.94L5.19 5.3a.5.5 0 0 0-.61.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.08.65-.08.94s.03.63.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.52c.04.24.24.4.49.4h3.84c.25 0 .45-.16.49-.4l.36-2.52c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
        </svg>
      </button>

      <button
        class="view-toggle-btn"
        onclick="showFormView()"
      >
        Formular anzeigen
      </button>

      <button
        class="share-btn"
        onclick="showQrCode()"
        aria-label="Teilen"
        title="Teilen"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.2 3.2 0 0 0 0-1.39l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .23.03.45.08.66L8.03 9.77a3 3 0 1 0 0 4.46l7.12 4.16c-.05.2-.08.41-.08.61A2.93 2.93 0 1 0 18 16.08Z"/>
        </svg>
      </button>

    </div>

    <table
      class="overview-table"
      id="overviewTable"
    ></table>

  </div>


  <!-- Umschalter Formular / Tabelle + Teilen -->

  <div class="bottom-actions" id="bottomActions">

    <button
      class="settings-btn"
      id="settingsButton"
      onclick="showSettings()"
      aria-label="Einstellungen"
      title="Einstellungen"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94L14.38 2.8a.49.49 0 0 0-.49-.4h-3.84a.49.49 0 0 0-.49.4l-.36 2.52c-.58.24-1.12.56-1.62.94L5.19 5.3a.5.5 0 0 0-.61.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.08.65-.08.94s.03.63.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.52c.04.24.24.4.49.4h3.84c.25 0 .45-.16.49-.4l.36-2.52c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
      </svg>
    </button>

    <div class="view-toggle-wrap">

      <button
        class="view-toggle-btn"
        id="viewToggleButton"
        onclick="toggleView()"
      >
        Tabelle anzeigen
      </button>

    </div>

    <button
      class="share-btn"
      id="shareButton"
      onclick="showQrCode()"
      aria-label="Teilen"
      title="Teilen"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.2 3.2 0 0 0 0-1.39l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .23.03.45.08.66L8.03 9.77a3 3 0 1 0 0 4.46l7.12 4.16c-.05.2-.08.41-.08.61A2.93 2.93 0 1 0 18 16.08Z"/>
      </svg>
    </button>

  </div>


  <!-- QR-Code-Ansicht -->

  <div class="qr-view" id="qrView">

    <div id="qrCode"></div>

    <div class="bottom-actions qr-nav">

      <button
        class="settings-btn"
        onclick="showSettings()"
        aria-label="Einstellungen"
        title="Einstellungen"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94L14.38 2.8a.49.49 0 0 0-.49-.4h-3.84a.49.49 0 0 0-.49.4l-.36 2.52c-.58.24-1.12.56-1.62.94L5.19 5.3a.5.5 0 0 0-.61.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.08.65-.08.94s.03.63.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.52c.04.24.24.4.49.4h3.84c.25 0 .45-.16.49-.4l.36-2.52c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
        </svg>
      </button>

      <button
        class="view-toggle-btn"
        onclick="showFormView()"
      >
        Formular anzeigen
      </button>

      <button
        class="share-btn"
        onclick="showQrCode()"
        aria-label="Teilen"
        title="Teilen"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.2 3.2 0 0 0 0-1.39l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .23.03.45.08.66L8.03 9.77a3 3 0 1 0 0 4.46l7.12 4.16c-.05.2-.08.41-.08.61A2.93 2.93 0 1 0 18 16.08Z"/>
        </svg>
      </button>

    </div>

    <div class="qr-url" id="qrUrlText"></div>

  </div>


  <!-- Einstellungen -->

  <div class="settings-view" id="settingsView">

    <div class="settings-card">

      <div class="bottom-actions settings-nav">

        <button
          class="settings-btn"
          onclick="showSettings()"
          aria-label="Einstellungen"
          title="Einstellungen"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94L14.38 2.8a.49.49 0 0 0-.49-.4h-3.84a.49.49 0 0 0-.49.4l-.36 2.52c-.58.24-1.12.56-1.62.94L5.19 5.3a.5.5 0 0 0-.61.22L2.66 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.08.65-.08.94s.03.63.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.52c.04.24.24.4.49.4h3.84c.25 0 .45-.16.49-.4l.36-2.52c.58-.24 1.12-.56 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
          </svg>
        </button>

        <button
          class="view-toggle-btn"
          onclick="showFormView()"
        >
          Formular anzeigen
        </button>

        <button
          class="share-btn"
          onclick="showQrCode()"
          aria-label="Teilen"
          title="Teilen"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.2 3.2 0 0 0 0-1.39l7.05-4.11A2.99 2.99 0 1 0 15 5c0 .23.03.45.08.66L8.03 9.77a3 3 0 1 0 0 4.46l7.12 4.16c-.05.2-.08.41-.08.61A2.93 2.93 0 1 0 18 16.08Z"/>
          </svg>
        </button>

      </div>

      <div class="settings-section">

        <h2>Dark Mode</h2>

        <div class="theme-row">

          <span id="themeLabel">Hell</span>

          <label class="theme-switch">
            <input
              type="checkbox"
              id="darkModeToggle"
              onchange="setDarkMode(this.checked)"
            >
            <span class="theme-slider"></span>

     * ============================================================
     */

    function createRandomAllEntry() {

      const currentTopics =
        getCurrentTopics();

      const allWords =
        Object.values(
          currentTopics
        ).flat();

      if (allWords.length === 0) {
        return null;
      }

      const englishChecked =
        document.getElementById(
          "randomEnglish"
        ).checked;

      const germanChecked =
        document.getElementById(
          "randomGerman"
        ).checked;

      if (!englishChecked && !germanChecked) {
        return null;
      }

      const word =
        allWords[
          Math.floor(
            Math.random() * allWords.length
          )
        ];

      let language;

      if (englishChecked && germanChecked) {

        language =
          Math.random() < 0.5
            ? "en"
            : "de";

      } else if (englishChecked) {

        language = "en";

      } else {

        language = "de";
      }

      return {
        word: word,
        language: language
      };
    }


    /*
     * ============================================================
     * Zufälligen All-Eintrag zur Historie hinzufügen
     * ============================================================
     */

    function addRandomAllEntry() {

      const entry =
        createRandomAllEntry();

      if (!entry) {

        const englishChecked =
          document.getElementById(
            "randomEnglish"
          ).checked;

        const germanChecked =
          document.getElementById(
            "randomGerman"
          ).checked;

        if (!englishChecked && !germanChecked) {

          document.getElementById(
            "songText"
          ).innerText =
            "Bitte Englisch und/oder Deutsch auswählen.";

        } else {

          showEmptyMessage();
        }

        document.getElementById(
          "feedbackArea"
        ).innerText = "";

        return false;
      }

      if (
        allHistoryIndex
        <
        allHistory.length - 1
      ) {

        allHistory =
          allHistory.slice(
            0,
            allHistoryIndex + 1
          );
      }

      allHistory.push(
        entry
      );

      allHistoryIndex =
        allHistory.length - 1;

      return true;
    }


    /*
     * ============================================================
     * Aktuellen Eintrag anzeigen
     * ============================================================
     */

    function showCurrentWord() {

      const topic =
        document.getElementById(
          "topicSelect"
        ).value;


      /*
       * ALL
       */

      if (topic === "all") {

        if (allHistoryIndex < 0) {

          if (!addRandomAllEntry()) {
            return;
          }
        }

        const entry =
          allHistory[
            allHistoryIndex
          ];

        document.getElementById(
          "songText"
        ).innerText =
          entry.language === "en"
            ? entry.word.en
            : entry.word.de;

        return;
      }


      /*
       * Einzelnes Thema
       */

      const currentArray =
        getCurrentArray();

      if (currentArray.length === 0) {
        showEmptyMessage();
        return;
      }

      if (
        currentWordIndex
        >=
        currentArray.length
      ) {
        currentWordIndex = 0;
      }

      const word =
        currentArray[
          currentWordIndex
        ];

      document.getElementById(
        "songText"
      ).innerText =
        getDirection() === "en-de"
          ? word.en
          : word.de;
    }


    /*
     * ============================================================
     * Wörter / Sätze wechseln
     * ============================================================
     */

    function changeMode() {

      currentWordIndex = 0;
      allHistory = [];
      allHistoryIndex = -1;

      document.getElementById(
        "feedbackArea"
      ).innerText = "";

      showCurrentWord();
    }


    /*
     * ============================================================
     * Thema wechseln
     * ============================================================
     */

    function changeTopic() {

      currentWordIndex = 0;
      allHistory = [];
      allHistoryIndex = -1;

      const isAll =
        document.getElementById(
          "topicSelect"
        ).value === "all";

      document.getElementById(
        "allOptions"
      ).style.display =
        isAll
          ? "block"
          : "none";

      document.getElementById(
        "directionGroup"
      ).style.display =
        isAll
          ? "none"
          : "block";

      document.getElementById(
        "feedbackArea"
      ).innerText = "";

      showCurrentWord();
    }


    /*
     * ============================================================
     * All-Zufall nach Änderung einer Checkbox zurücksetzen
     * ============================================================
     */

    function resetAllRandom() {

      allHistory = [];
      allHistoryIndex = -1;

      document.getElementById(
        "feedbackArea"
      ).innerText = "";

      showCurrentWord();
    }


    /*
     * ============================================================
     * Anzeige zurücksetzen
     * ============================================================
     */

    function resetUI() {

      currentWordIndex = 0;

      document.getElementById(
        "feedbackArea"
      ).innerText = "";

      showCurrentWord();
    }


    /*
     * ============================================================
     * Nächster Eintrag
     * ============================================================
     */

    function nextWord() {

      const topic =
        document.getElementById(
          "topicSelect"
        ).value;


      /*
       * ALL
       */

      if (topic === "all") {

        if (
          allHistoryIndex
          <
          allHistory.length - 1
        ) {

          allHistoryIndex++;

        } else {

          if (!addRandomAllEntry()) {
            return;
          }
        }

        showCurrentWord();

        document.getElementById(
          "feedbackArea"
        ).innerText = "";

        return;
      }


      /*
       * Einzelnes Thema
       */

      const currentArray =
        getCurrentArray();

      if (currentArray.length === 0) {
        showEmptyMessage();
        return;
      }

      currentWordIndex =
        (
          currentWordIndex + 1
        )
        %
        currentArray.length;

      showCurrentWord();

      document.getElementById(
        "feedbackArea"
      ).innerText = "";
    }


    /*
     * ============================================================
     * Vorheriger Eintrag
     * ============================================================
     */

    function prevWord() {

      const topic =
        document.getElementById(
          "topicSelect"
        ).value;


      /*
       * ALL
       */

      if (topic === "all") {

        if (allHistoryIndex > 0) {

          allHistoryIndex--;

          showCurrentWord();
        }

        document.getElementById(
          "feedbackArea"
        ).innerText = "";

        return;
      }


      /*
       * Einzelnes Thema
       */

      const currentArray =
        getCurrentArray();

      if (currentArray.length === 0) {
        showEmptyMessage();
        return;
      }

      currentWordIndex =
        (
          currentWordIndex
          - 1
          + currentArray.length
        )
        %
        currentArray.length;

      showCurrentWord();

      document.getElementById(
        "feedbackArea"
      ).innerText = "";
    }


    /*
     * ============================================================
     * Übersetzung anzeigen
     * ============================================================
     */

    function checkTranslation() {

      const topic =
        document.getElementById(
          "topicSelect"
        ).value;


      /*
       * ALL
       */

      if (topic === "all") {

        if (allHistoryIndex < 0) {
          return;
        }

        const entry =
          allHistory[
            allHistoryIndex
          ];

        document.getElementById(
          "feedbackArea"
        ).innerText =
          entry.language === "en"
            ? entry.word.de
            : entry.word.en;

        return;
      }


      /*
       * Einzelnes Thema
       */

      const currentArray =
        getCurrentArray();

      if (currentArray.length === 0) {
        showEmptyMessage();
        return;
      }

      const word =
        currentArray[
          currentWordIndex
        ];

      const direction =
        getDirection();

      document.getElementById(
        "feedbackArea"
      ).innerText =
        direction === "en-de"
          ? word.de
          : word.en;
    }


    /*
     * ============================================================
     * Gesamttabelle erzeugen
     * ============================================================
     */

    function buildOverviewTable() {

      const table =
        document.getElementById(
          "overviewTable"
        );

      const topicSelect =
        document.getElementById(
          "topicSelect"
        );

      table.innerHTML = "";

      Array.from(
        topicSelect.options
      ).forEach(option => {

        const topicKey = option.value;

        if (topicKey === "all") {
          return;
        }

        const words =
          topicsWords[topicKey] || [];

        const sentences =
          topicsSentences[topicKey] || [];

        const entries = [
          ...words,
          ...sentences
        ];

        if (entries.length === 0) {
          return;
        }

        const topicRow =
          document.createElement(
            "tr"
          );

        topicRow.className =
          "topic-row";

        topicRow.innerHTML = `
          <th class="topic-name">${option.textContent}</th>
          <th class="language-head">Englisch</th>
          <th class="language-head">Deutsch</th>
        `;

        table.appendChild(
          topicRow
        );

        entries.forEach(entry => {

          const row =
            document.createElement(
              "tr"
            );

          const emptyCell =
            document.createElement(
              "td"
            );

          emptyCell.className =
            "empty-topic-cell";

          const englishCell =
            document.createElement(
              "td"
            );

          englishCell.textContent =
            entry.en;

          const germanCell =
            document.createElement(
              "td"
            );

          germanCell.textContent =
            entry.de;

          row.appendChild(
            emptyCell
          );

          row.appendChild(
            englishCell
          );

          row.appendChild(
            germanCell
          );

          table.appendChild(
            row
          );
        });
      });
    }


    /*
     * ============================================================
     * Zwischen Formular und Gesamttabelle wechseln
     * ============================================================
     */

    function toggleView() {

      document.getElementById(
        "settingsView"
      ).style.display = "none";

      document.getElementById(
        "qrView"
      ).style.display = "none";

      document.getElementById(
        "bottomActions"
      ).style.display = "flex";


      const formView =
        document.getElementById(
          "formView"
        );

      const tableView =
        document.getElementById(
          "tableView"
        );

      const toggleButton =
        document.getElementById(
          "viewToggleButton"
        );

      const tableIsVisible =
        tableView.style.display ===
          "block";


      if (tableIsVisible) {

        tableView.style.display =
          "none";

        formView.style.display =
          "block";

        toggleButton.innerText =
          "Tabelle anzeigen";

      } else {

        buildOverviewTable();

        formView.style.display =
          "none";

        tableView.style.display =
          "block";

        toggleButton.innerText =
          "Formular anzeigen";
      }
    }


    /*
     * ============================================================
     * QR-Code / Teilen
     * ============================================================
     */

    const qrUrl =
      "https://fritzreuter.github.io/Klasse4a-Englisch1";

    let qrCodeCreated = false;


    function showQrCode() {

      document.getElementById(
        "settingsView"
      ).style.display = "none";

      document.getElementById(
        "formView"
      ).style.display = "none";

      document.getElementById(
        "tableView"
      ).style.display = "none";

      document.getElementById(
        "bottomActions"
      ).style.display = "none";

      document.getElementById(
        "qrView"
      ).style.display = "flex";

      document.getElementById(
        "qrUrlText"
      ).textContent = qrUrl;


      if (!qrCodeCreated) {

        new QRCode(
          document.getElementById(
            "qrCode"
          ),
          {
            text: qrUrl,
            width: 300,
            height: 300,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          }
        );

        qrCodeCreated = true;
      }
    }


    function showFormView() {

      document.getElementById(
        "settingsView"
      ).style.display = "none";

      document.getElementById(
        "qrView"
      ).style.display = "none";

      document.getElementById(
        "tableView"
      ).style.display = "none";

      document.getElementById(
        "formView"
      ).style.display = "block";

      document.getElementById(
        "bottomActions"
      ).style.display = "flex";

      document.getElementById(
        "viewToggleButton"
      ).innerText = "Tabelle anzeigen";
    }


    /*
     * ============================================================
     * Einstellungen / Dark Mode
     * ============================================================
     */

    function showSettings() {

      document.getElementById(
        "formView"
      ).style.display = "none";

      document.getElementById(
        "tableView"
      ).style.display = "none";

      document.getElementById(
        "qrView"
      ).style.display = "none";

      document.getElementById(
        "bottomActions"
      ).style.display = "none";

      document.getElementById(
        "settingsView"
      ).style.display = "block";
    }


    function setDarkMode(enabled) {

      document.body.classList.toggle(
        "dark-mode",
        enabled
      );

      document.getElementById(
        "darkModeToggle"
      ).checked = enabled;

      document.getElementById(
        "themeLabel"
      ).textContent =
        enabled
          ? "Dunkel"
          : "Hell";

      localStorage.setItem(
        "darkMode",
        enabled
          ? "dark"
          : "light"
      );
    }


    function loadDarkMode() {

      setDarkMode(
        localStorage.getItem(
          "darkMode"
        ) === "dark"
      );
    }


    /*
     * ============================================================
     * Tastatur-Shortcuts – nur in der Formularansicht
     * ============================================================
     */

    document.addEventListener(
      "keydown",
      function(event) {

        const formView =
          document.getElementById(
            "formView"
          );

        if (
          formView.style.display === "none"
        ) {
          return;
        }


        if (event.key === "ArrowLeft") {

          event.preventDefault();
          prevWord();

        } else if (
          event.key === "ArrowRight"
        ) {

          event.preventDefault();
          nextWord();

        } else if (
          event.key === "ArrowDown"
        ) {

          event.preventDefault();
          checkTranslation();
        }
      }
    );


    /*
     * ============================================================
     * Initialisieren
     * ============================================================
     */

    loadDarkMode();
    changeTopic();

  </script>

</body>
</html>
